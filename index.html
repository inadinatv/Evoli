<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0b0b10">
<title>FilmBot</title>
<style>
:root{--bg:#0b0b10;--card:#171722;--acc:#e50914;--txt:#eee;--muted:#888;--border:#2a2a38}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}

header{position:sticky;top:0;z-index:20;background:rgba(11,11,16,.95);backdrop-filter:blur(12px);padding:12px 14px;border-bottom:1px solid var(--border)}
.top{display:flex;gap:10px;align-items:center}
.top h1{font-size:18px;white-space:nowrap;font-weight:700}
.top h1 span{color:var(--acc)}
#q{flex:1;background:#1c1c28;border:1px solid var(--border);color:#fff;padding:10px 14px;border-radius:22px;outline:none;font-size:14px}
#q:focus{border-color:var(--acc)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:#1c1c28;border:1px solid var(--border);padding:7px 14px;border-radius:16px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{background:#252535}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}

.count{padding:10px 16px 0;font-size:12px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:14px}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}}

.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .18s;position:relative}
.card:hover{transform:scale(1.04)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}
.card .t{padding:8px 10px;font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.card .new{position:absolute;top:6px;right:6px;background:var(--acc);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.98);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.hidden{display:none!important}
.box{width:100%;max-width:1100px;background:#000;border-radius:8px;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0a0a0f}
.mhead h2{font-size:15px;font-weight:600;flex:1}
#mclose{background:var(--acc);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.video-wrap{width:100%;background:#000;position:relative}
.video-wrap video{width:100%;max-height:80vh;display:block;background:#000}

#loading{padding:60px 20px;text-align:center;color:var(--muted)}
#loading .spinner{display:inline-block;width:40px;height:40px;border:3px solid #222;border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.5)}

.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h3{margin-bottom:8px;color:#bbb}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>🎬 Film<span>Bot</span></h1>
    <input id="q" placeholder="Film ara..." autocomplete="off">
  </div>
  <div id="cats" class="chips"></div>
</header>

<div id="count" class="count"></div>
<main id="grid" class="grid"></main>
<div id="loading"><div class="spinner"></div><div>Yükleniyor...</div></div>

<div id="modal" class="modal hidden">
  <div class="box">
    <div class="mhead">
      <h2 id="mtitle"></h2>
      <button id="mclose">✕</button>
    </div>
    <div class="video-wrap">
      <video id="player" controls playsinline preload="auto"></video>
    </div>
  </div>
</div>

<script>
// ============================================
const PROXY = "https://evolixx.burhantasci72.workers.dev/?url=";
// ============================================

let FILMS = [], curCat = "Tümü", curQ = "", curFilm = null, updated = "";

function px(u) { 
  if (!PROXY) return u;
  return PROXY + encodeURIComponent(u); 
}

function toast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

fetch("films.json?" + Date.now())
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(db => { FILMS = db.films || []; updated = db.updated || ""; init(); })
  .catch(e => { document.getElementById('loading').innerHTML = "<h3>Hata: " + e.message + "</h3>"; });

function init() {
  document.getElementById('loading').style.display = 'none';
  chips();
  render();
}

function imgFail(el, direct) {
  if (el.dataset.fb === "1") { el.dataset.fb = "2"; el.src = direct; return; }
  if (el.dataset.fb === "2") { el.style.opacity = .15; return; }
  el.dataset.fb = "1";
  el.onerror = () => imgFail(el, direct);
}

const counts = {};
FILMS.forEach(f => (f.categories || []).forEach(c => counts[c] = (counts[c] || 0) + 1));
const cats = ["Tümü", ...Object.entries(counts).sort((a, b) => b[1] - a[1]).map(e => e[0])];

const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

function chips() {
  document.getElementById('cats').innerHTML = cats.map(c =>
    `<div class="chip ${c === curCat ? 'on' : ''}" onclick="setCat('${esc(c)}')">${esc(c)}${c !== 'Tümü' ? ' (' + counts[c] + ')' : ''}</div>`
  ).join('');
}

function setCat(c) { curCat = c; chips(); render(); }

function render() {
  const g = document.getElementById('grid');
  const list = FILMS.filter(f =>
    (curCat === "Tümü" || (f.categories || []).includes(curCat)) &&
    f.title.toLowerCase().includes(curQ)
  );
  
  document.getElementById('count').innerHTML =
    `<b>${list.length}</b> film · Kitaplık: <b>${FILMS.length}</b>`;
  
  if (list.length === 0) {
    g.innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>Film bulunamadı</h3></div>`;
    return;
  }
  
  g.innerHTML = list.map(f => {
    return `<div class="card" onclick="ac('${f.id}')">
      <img loading="lazy" src="${px(f.poster)}" onerror="imgFail(this,'${esc(f.poster)}')" alt="${esc(f.title)}">
      <div class="t">${esc(f.title)}</div>
    </div>`;
  }).join('');
}

function ac(id) {
  curFilm = FILMS.find(f => f.id === id);
  if (!curFilm) return;
  
  document.getElementById('mtitle').textContent = curFilm.title;
  
  const videoEl = document.getElementById('player');
  const url = px(curFilm.stream);
  
  // DEBUG: URL'yi console'a ve toast'a yaz
  console.log("🎬 Video URL:", url);
  toast("Video yükleniyor...");
  
  videoEl.onerror = function(e) {
    console.error("Video error:", e);
    toast("❌ Video yüklenemedi!");
  };
  
  videoEl.oncanplay = function() {
    toast("✓ Video hazır");
  };
  
  videoEl.src = url;
  videoEl.load();
  
  document.getElementById('modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  
  setTimeout(() => {
    videoEl.play().catch(err => {
      console.error("Play error:", err);
      toast("⚠️ Oynatma hatası: " + err.message);
    });
  }, 200);
}

document.getElementById('mclose').onclick = () => {
  const videoEl = document.getElementById('player');
  videoEl.pause();
  videoEl.src = '';
  videoEl.load();
  document.getElementById('modal').classList.add('hidden');
  document.body.style.overflow = '';
};

document.getElementById('q').oninput = e => { curQ = e.target.value.toLowerCase().trim(); render(); };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('modal').classList.contains('hidden')) {
    document.getElementById('mclose').click();
  }
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') document.getElementById('mclose').click();
});
</script>
</body>
</html>
