<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FilmBot Katalog</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
<style>
:root{--bg:#0b0b10;--card:#171722;--acc:#e50914;--txt:#eee}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,16,.95);backdrop-filter:blur(10px);padding:12px 14px;border-bottom:1px solid #23232f}
.top{display:flex;gap:10px;align-items:center}
.top h1{font-size:18px;white-space:nowrap}.top h1 span{color:var(--acc)}
#q{flex:1;background:#1c1c28;border:1px solid #2c2c3a;color:#fff;padding:9px 12px;border-radius:20px;outline:none;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:#1c1c28;border:1px solid #2c2c3a;padding:6px 14px;border-radius:16px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s}
.chip:hover{background:#252535}.chip.on{background:var(--acc);border-color:var(--acc);font-weight:700}
.count{padding:10px 16px 0;font-size:12px;color:#888}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:14px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s}
.card:hover{transform:scale(1.04);box-shadow:0 4px 20px rgba(229,9,20,.3)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}
.card .t{padding:8px;font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto}
.hidden{display:none}
.box{width:100%;max-width:960px;background:#101018;border-radius:12px;overflow:hidden;border:1px solid #2a2a38;position:relative}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#0a0a0f}
.mhead h2{font-size:16px;font-weight:600}
#mclose{background:var(--acc);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#mclose:hover{background:#c00}
.video-wrap{width:100%;background:#000}
.video-wrap .plyr{width:100%;max-height:70vh}
.mtags{padding:12px 18px;display:flex;gap:6px;flex-wrap:wrap}
.mtags span{background:#1c1c28;font-size:11px;padding:5px 12px;border-radius:12px;color:#bbb}
.mbtns{padding:0 18px 18px;display:flex;gap:8px;flex-wrap:wrap}
.mbtns button,.mbtns a{flex:1;background:#1c1c28;border:1px solid #2c2c3a;color:#fff;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;text-align:center;text-decoration:none;transition:background .2s}
.mbtns button:hover,.mbtns a:hover{background:#252535}
#loading{padding:40px;text-align:center;color:#888}
.plyr__control--overlaid{background:var(--acc)}
</style></head><body>
<header><div class="top"><h1>🎬 Film<span>Bot</span></h1>
<input id="q" placeholder="Film ara..."></div>
<div id="cats" class="chips"></div></header>
<div id="count" class="count"></div>
<main id="grid" class="grid"></main>
<div id="loading">Kitaplık yükleniyor...</div>
<div id="modal" class="modal hidden"><div class="box">
<div class="mhead"><h2 id="mtitle"></h2><button id="mclose">✕</button></div>
<div class="video-wrap"><video id="player" playsinline controls></video></div>
<div id="mtags" class="mtags"></div>
<div class="mbtns"><button id="copym3u">📋 M3U Linkini Kopyala</button>
<a id="dl">⬇️ MP4 İndir</a><button id="share">🔗 Paylaş</button></div>
</div></div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script>
// ====== BURAYA KENDI WORKER ADRESINI YAZ ======
const PROXY = "https://evolixx.burhantasci72.workers.dev/?url=";
// ==============================================
const UA="Mozilla%2F5.0+%28Linux%3B+Android+15%3B+2412DPC0AG+Build%2FAP3A.240905.015.A2%3B+wv%29+AppleWebKit%2F537.36+%28KHTML%2C+like+Gecko%29+Version%2F4.0+Chrome%2F151.0.7922.199+Mobile+Safari%2F537.36";
const RF="https%3A%2F%2Fwww.evoolipxnyxzq.shop%2F";

let FILMS=[],curCat="Tümü",curQ="",curFilm=null,updated="",player=null;

function px(u){return PROXY? PROXY+encodeURIComponent(u) : u}

fetch("films.json?"+Date.now()).then(r=>r.json()).then(db=>{
  FILMS=db.films||[];updated=db.updated||"";init();
}).catch(e=>{document.getElementById('loading').textContent="films.json yüklenemedi: "+e});

function init(){
  document.getElementById('loading').style.display='none';
  // Plyr player'ı başlat
  player = new Plyr('#player', {
    controls: ['play-large','play','progress','current-time','duration','mute','volume','captions','settings','pip','airplay','fullscreen'],
    settings: ['captions','quality','speed','loop'],
    tooltips: { controls: true, seek: true },
    keyboard: { focused: true, global: true },
    fullscreen: { enabled: true, fallback: true, iosNative: true }
  });
  chips();render();
}

function imgFail(el,direct){
  if(el.dataset.fb){el.style.opacity=.15;return}
  el.dataset.fb="1";el.onerror=null;el.src=direct;
  el.onerror=()=>{el.style.opacity=.15};
}

const counts={};FILMS.forEach(f=>(f.categories||[]).forEach(c=>counts[c]=(counts[c]||0)+1));
const cats=["Tümü",...Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(e=>e[0])];
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function chips(){
  document.getElementById('cats').innerHTML=
    cats.map(c=>`<div class="chip ${c===curCat?'on':''}" onclick="setCat('${esc(c)}')">${esc(c)}${c!=='Tümü'?' ('+counts[c]+')':''}</div>`).join('');
}

function setCat(c){curCat=c;chips();render()}

function render(){
  const g=document.getElementById('grid');
  const list=FILMS.filter(f=>(curCat==="Tümü"||(f.categories||[]).includes(curCat))
    &&f.title.toLowerCase().includes(curQ));
  document.getElementById('count').textContent=
    list.length+" film (kitaplık: "+FILMS.length+", son güncelleme: "+updated+")";
  g.innerHTML=list.map(f=>`<div class="card" onclick="ac('${f.id}')"><img loading="lazy"
    src="${px(f.poster)}" onerror="imgFail(this,'${f.poster}')">
    <div class="t">${esc(f.title)}</div></div>`).join('');
}

function ac(id){
  curFilm=FILMS.find(f=>f.id===id);
  if(!curFilm)return;
  document.getElementById('mtitle').textContent=curFilm.title;
  document.getElementById('mtags').innerHTML=(curFilm.categories||[]).map(c=>`<span>${esc(c)}</span>`).join('');
  
  // Video kaynağını ayarla
  const videoEl=document.getElementById('player');
  videoEl.src=px(curFilm.stream);
  videoEl.load();
  
  document.getElementById('dl').href=px(curFilm.stream);
  document.getElementById('dl').download=curFilm.id+'.mp4';
  document.getElementById('modal').classList.remove('hidden');
  
  // Otomatik oynat
  setTimeout(()=>{player.play()},100);
}

document.getElementById('mclose').onclick=()=>{
  player.pause();
  document.getElementById('player').src='';
  document.getElementById('modal').classList.add('hidden');
};

document.getElementById('copym3u').onclick=()=>{
  if(curFilm){
    const line=curFilm.stream+"|User-Agent="+UA+"|Referer="+RF;
    navigator.clipboard?navigator.clipboard.writeText(line):prompt("Kopyala:",line);
    alert("M3U linki kopyalandı!")
  }
};

document.getElementById('share').onclick=()=>{
  if(curFilm){
    const shareUrl=window.location.origin+window.location.pathname+'#'+curFilm.id;
    navigator.clipboard?navigator.clipboard.writeText(shareUrl):prompt("Kopyala:",shareUrl);
    alert("Paylaşım linki kopyalandı!")
  }
};

document.getElementById('q').oninput=e=>{curQ=e.target.value.toLowerCase().trim();render()};

// URL hash'ten film aç
window.addEventListener('load',()=>{
  const hash=window.location.hash.slice(1);
  if(hash){
    setTimeout(()=>{
      const f=FILMS.find(x=>x.id===hash);
      if(f)ac(hash);
    },500);
  }
});
</script></body></html>
