name: Otomatik Güncelleme
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python -c "from scraper import scan; scan()"
      - run: |
          git config user.name "film-bot"
          git config user.email "bot@users.noreply.github.com"
          git add films.json playlist.m3u
          git diff --cached --quiet || git commit -m "auto update"
          git push
